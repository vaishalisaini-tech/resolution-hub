services:
  hub:
    build: .
    ports: ["127.0.0.1:8001:8001"]
    env_file: .env
    environment:
      DATABASE_PATH: /srv/hub/data/hub-v3.db
      INSTANCE_CONFIG: /srv/hub/config/instance.json
    volumes: ["hub-data:/srv/hub/data"]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 2g
    pids_limit: 128
volumes:
  hub-data:
