# TEMPLATE: replace hostname/certificate paths and validate with your operations team.
# Same-host reverse proxy; never expose raw app/model ports to untrusted networks.
limit_req_zone $binary_remote_addr zone=hub_login:10m rate=5r/m;
server {
    listen 443 ssl;
    server_name hub.example.internal;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 21m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /api/auth/login {
        limit_req zone=hub_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_read_timeout 150s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
